<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pathway — Transfer Planner</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/planner.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="app-shell">
    <main class="content">
      <header class="topbar"><span class="status">● Demo mode</span><button class="theme-toggle" id="theme-button" aria-label="Change color theme">☀ Light</button><div id="auth-controls" class="auth-controls"></div></header>
      <section class="page" id="app"></section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-subtitle">
    <button type="button" class="auth-close" id="auth-close" aria-label="Close">×</button>
    <h2 id="auth-subtitle">Welcome back to Pathway</h2>
    <form id="auth-form">
      <label for="auth-email">Email address</label>
      <input id="auth-email" type="email" name="email" autocomplete="email" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" name="password" autocomplete="current-password" minlength="10" required>
      <button class="auth-primary" id="auth-submit" type="submit">Log in</button>
      <button class="auth-text" id="auth-toggle" type="button">Need an account? Sign up</button>
      <p class="auth-message" id="auth-message" role="alert"></p>
    </form>
    <div class="auth-divider">or</div>
    <div id="google-signin"></div>
  </dialog>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
