
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>De Anza Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/planner.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/services.css">
</head>

<body>
  <div class="app-shell">
    <main class="content">

      <!-- Main navigation -->
      <header class="topbar">
        <a class="site-brand" href="?" aria-label="De Anza Guide home">
          <span class="site-brand-mark" aria-hidden="true">DA</span>
          <span class="site-brand-name">De Anza Guide</span>
        </a>

        <nav class="primary-nav" aria-label="Main navigation">
          <a href="?service=transfer" data-service="transfer">Transfer Planner</a>
          <a href="?service=compass" data-service="compass">De Anza Events</a>
          <a href="?service=chat" data-service="chat">De Anza Chatbot</a>
        </nav>

        <div class="header-actions">
          <button class="theme-switch" id="theme-button" type="button" role="switch" aria-label="Switch to dark theme" aria-checked="false"></button>
          <div id="auth-controls" class="auth-controls"></div>
        </div>
      </header>

      <!-- Main application -->
      <section class="page" id="app"></section>

    </main>
  </div>

  <!-- Main application JavaScript -->
  <script type="module" src="js/app.js"></script>

  <!-- Authentication dialog -->
  <dialog
    id="auth-dialog"
    class="auth-dialog"
    aria-labelledby="auth-subtitle"
  >
    <button
      type="button"
      class="auth-close"
      id="auth-close"
      aria-label="Close"
    >
      ×
    </button>

    <h2 id="auth-subtitle">Welcome back to De Anza Guide</h2>

    <form id="auth-form">
      <label for="auth-email">Email address</label>
      <input
        id="auth-email"
        type="email"
        name="email"
        autocomplete="email"
        required
      >

      <label for="auth-password">Password</label>
      <input
        id="auth-password"
        type="password"
        name="password"
        autocomplete="current-password"
        minlength="10"
        required
      >

      <button
        class="auth-primary"
        id="auth-submit"
        type="submit"
      >
        Log in
      </button>

      <button
        class="auth-text"
        id="auth-toggle"
        type="button"
      >
        Need an account? Sign up
      </button>

      <p
        class="auth-message"
        id="auth-message"
        role="alert"
      ></p>
    </form>

    <button class="auth-text" id="auth-forgot" type="button" hidden>Forgot password?</button>
    <div class="auth-divider">or</div>

    <div id="google-signin"></div>
  </dialog>

  <!-- Authentication JavaScript -->
  <script type="module" src="js/auth.js"></script>

</body>
</html>
